<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Кривоклык — кликер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&display=swap">
<style>
:root{--ember:#ff7a2f;--gold:#ffc83d;--ink:#2a1a12;--line:#e6d6c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;padding:12px;z-index:5}
.bal{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);box-shadow:0 2px 8px #0001;border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;font-size:clamp(18px,5vw,24px)}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#c98a00);box-shadow:inset 0 0 0 3px #e0a100}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.btn{font:800 clamp(15px,4.2vw,18px) 'Rubik',sans-serif;color:#2a1200;background:linear-gradient(var(--gold),var(--ember));border:0;border-radius:14px;padding:10px 18px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 #a64a0a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a64a0a}
.btn.alt{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:8px 16px}
main{height:100%;display:flex;align-items:center;justify-content:center}
#tap{width:min(72vw,46dvh,340px);border:0;padding:0;cursor:pointer;background:none;transition:transform .08s;display:flex;justify-content:center;align-items:center;min-height:160px}
#tap.p{transform:scale(.93)}
#tap img{height:auto;pointer-events:none;display:block}
.em{font-size:min(50vw,30dvh);line-height:1;pointer-events:none}
.pop{position:fixed;font-weight:800;font-size:28px;color:#e8590c;text-shadow:0 2px 0 #fff;pointer-events:none;animation:up .8s ease-out forwards;z-index:6}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.fall{position:fixed;top:-140px;width:90px;cursor:pointer;z-index:7;filter:drop-shadow(0 4px 10px #0003);transition:top 5s linear}
.fall img{width:100%;display:block;pointer-events:none}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
.ov.on{display:flex}
.panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;width:min(480px,100%);max-height:90dvh;overflow-y:auto}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.head h2{margin:0;font-size:24px}
.x{font:800 16px 'Rubik',sans-serif;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.item{background:#faf4ee;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.item .pic{height:110px;display:flex;align-items:flex-end}
.item .pic img{object-fit:contain}
.item .pic .em{font-size:84px}
.item b{font-size:15px}
.buy{font:800 16px 'Rubik',sans-serif;width:100%;min-height:42px;border:0;border-radius:10px;padding:10px;cursor:pointer;color:#2a1200;background:linear-gradient(var(--gold),var(--ember))}
.buy:disabled{background:#ddd;color:#888;cursor:not-allowed}
.loc{border:2px solid var(--line);border-radius:14px;padding:8px;background:#faf4ee;display:flex;flex-direction:column;gap:8px;text-align:center}
.loc .pv{height:64px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;font-size:26px;border:1px solid #0002;overflow:hidden}
.loc b{font-size:15px}
.loc.on{border-color:var(--ember);box-shadow:0 0 0 3px #ff7a2f44}
#deco{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;font-size:clamp(36px,11vw,68px);line-height:1;opacity:.9;pointer-events:none;z-index:0;padding:0 8px 6px}
main{position:relative;z-index:1}
.msg{min-height:22px;margin-top:10px;text-align:center;color:#c0392b;font-weight:600}
.lab{font-weight:800;margin:6px 0 8px}
.chars,.cols{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sk{width:78px;height:78px;border:3px solid var(--line);border-radius:14px;background:#faf4ee;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:4px}
.sk.on{border-color:var(--ember);box-shadow:0 0 0 3px #ff7a2f44}
.sk img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.sk .em{font-size:48px}
.cn{font-size:12px;text-align:center;font-weight:600;margin-top:2px;width:78px}
@media (prefers-reduced-motion:reduce){.fall{transition-duration:8s}.pop{animation-duration:.01s}}
</style></head><body>
<div class="bar">
  <div class="bal"><span class="coin"></span><span id="bal">0</span></div>
  <div class="side">
    <button class="btn" id="openShop">Магазин</button>
    <button class="btn alt" id="openSkins">Скины</button>
    <button class="btn alt" id="openMap">Карта</button>
    <button class="btn alt" id="mus" aria-label="Музыка">🎵</button>
  </div>
</div>
<div id="deco"></div>
<main><button id="tap" aria-label="Тап"></button></main>
<div class="ov" id="shop"><div class="panel">
  <div class="head"><h2>Магазин</h2><button class="x" id="closeShop">Закрыть</button></div>
  <div class="grid" id="items"></div><div class="msg" id="msg"></div>
</div></div>
<div class="ov" id="map"><div class="panel">
  <div class="head"><h2>Карта</h2><button class="x" id="closeMap">Закрыть</button></div>
  <div class="grid" id="locs"></div><div class="msg" id="mapmsg"></div>
</div></div>
<div class="ov" id="skins"><div class="panel">
  <div class="head"><h2>Скины</h2><button class="x" id="closeSkins">Закрыть</button></div>
  <div class="lab">Персонаж</div><div class="chars" id="chars"></div>
  <div class="lab">Расцветка</div><div class="cols" id="cols"></div>
</div></div>

/* Персонажи. Для хомяка пока эмодзи: когда пришлёшь фото, подставим картинку в img. */
var CH={
 k:{name:'Кривоклык',img:IMG.k,w:100,free:true},
 s:{name:'Маленький Стич',img:IMG.st,w:70,price:6700},
 b:{name:'Большой Стич',img:IMG.st,w:100,price:9999},
 h:{name:'Хомяк',img:null,emoji:'🐹',w:100,price:3000}
};
var COLS=[['Оригинал','none'],['Розовый','hue-rotate(310deg) saturate(1.1)'],['Зелёный','hue-rotate(95deg)'],['Фиолетовый','hue-rotate(235deg)'],['Золотой','sepia(1) saturate(2.2) hue-rotate(-10deg)'],['Чёрно-белый','grayscale(1)']];
var S={coins:0,own:{s:false,b:false,h:false},skin:'k',color:0,mute:false,loc:'g',locOwn:{}};
try{var d=JSON.parse(localStorage.getItem('krivoklyk')||'null');if(d&&typeof d.coins==='number'){for(var k in d)S[k]=d[k];S.own=Object.assign({s:false,b:false,h:false},d.own||{})}}catch(e){}
S.locOwn=S.locOwn||{};
function save(){try{localStorage.setItem('krivoklyk',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function has(id){return CH[id].free||S.own[id]}
function pic(id,filter,cls){var c=CH[id];return c.img?'<img src="'+c.img+'" style="'+(filter&&filter!=='none'?'filter:'+filter:'')+'" alt="'+c.name+'">':'<span class="em" style="'+(filter&&filter!=='none'?'filter:'+filter:'')+'">'+c.emoji+'</span>'}
function renderTap(){
  var c=CH[S.skin],f=COLS[S.color][1];
  $('tap').innerHTML=c.img?'<img src="'+c.img+'" style="width:'+c.w+'%;'+(f!=='none'?'filter:'+f:'')+'" alt="'+c.name+'">':pic(S.skin,f);
  if(!c.img)$('tap').firstChild.style.fontSize=(c.w*0.5)+'vw';
}
function renderShop(){
  var h='';
  ['s','b','h'].forEach(function(id){var c=CH[id];
    h+='<div class="item"><div class="pic">'+(c.img?'<img style="height:'+(c.w===70?70:110)+'px" src="'+c.img+'" alt="">':'<span class="em">'+c.emoji+'</span>')+'</div><b>'+c.name+'</b><button class="buy" data-id="'+id+'"'+(S.own[id]||S.coins<c.price?' disabled':'')+'>'+(S.own[id]?'Куплено':c.price.toLocaleString('ru-RU'))+'</button></div>'});
  $('items').innerHTML=h;
}
function renderSkins(){
  var h='';for(var id in CH){if(!has(id))continue;h+='<div><div class="sk'+(S.skin===id?' on':'')+'" data-skin="'+id+'">'+pic(id)+'</div><div class="cn">'+CH[id].name+'</div></div>'}
  $('chars').innerHTML=h;
  h='';COLS.forEach(function(c,i){h+='<div><div class="sk'+(S.color===i?' on':'')+'" data-col="'+i+'">'+pic(S.skin,c[1])+'</div><div class="cn">'+c[0]+'</div></div>'});
  $('cols').innerHTML=h;
}
var LOCS=[
{id:'g',name:'Белая поляна',price:0,bg:'#fff',deco:''},
{id:'f',name:'Лес',price:2000,bg:'linear-gradient(#bfe8c4,#7fc98a 60%,#3f8f4f)',deco:'🌲🌳🌲🌲🌳🌲'},
{id:'s',name:'Берег моря',price:4000,bg:'linear-gradient(#bfe9ff 0%,#e8f7ff 45%,#4fb3e8 45%,#2b86c5 72%,#f2dfa8 72%)',deco:'🌴🐚🌴🦀🌴'},
{id:'d',name:'Пустыня',price:6000,bg:'linear-gradient(#ffe8b0,#f7c873 55%,#e0a14a)',deco:'🌵🏜️🌵🐪🌵'},
{id:'m',name:'Горы',price:8000,bg:'linear-gradient(#cfe3f5,#e8f1fa 50%,#9aa6b2 50%,#6b7683)',deco:'⛰️🏔️⛰️🏔️'},
{id:'t',name:'Снежная тундра',price:10000,bg:'linear-gradient(#e9f4ff,#fff 60%,#d3e4f2)',deco:'🌲❄️🌲⛄🌲'},
{id:'b',name:'Болото',price:12000,bg:'linear-gradient(#c9d8a0,#8fa65a 55%,#5d7a3a)',deco:'🌿🐸🌿🍄🌿'},
{id:'v',name:'Вулкан',price:15000,bg:'linear-gradient(#4a1818,#c8431e 60%,#ff8a2f)',deco:'🌋🔥🌋🔥'},
{id:'n',name:'Звёздная ночь',price:20000,bg:'linear-gradient(#0b1030,#2a1f5c 70%,#4a2f7a)',deco:'🌙✨⭐✨🌙'},
{id:'i',name:'Остров драконов',price:30000,bg:'linear-gradient(#ffd9a0,#ff9fb0 40%,#7f6fd6 75%,#2b4a8c)',deco:'🐉🏝️🐉🏝️'}
];
function applyLoc(){var l=LOCS.filter(function(x){return x.id===S.loc})[0]||LOCS[0];document.body.style.background=l.bg;$('deco').textContent=l.deco}
function renderMap(){
  var h='';LOCS.forEach(function(l){var own=l.price===0||S.locOwn[l.id],cur=S.loc===l.id;
    h+='<div class="loc'+(cur?' on':'')+'"><div class="pv" style="background:'+l.bg+'">'+l.deco.slice(0,4)+'</div><b>'+l.name+'</b><button class="buy" data-loc="'+l.id+'"'+(cur||(!own&&S.coins<l.price)?' disabled':'')+'>'+(cur?'Выбрано':own?'Выбрать':l.price.toLocaleString('ru-RU'))+'</button></div>'});
  $('locs').innerHTML=h;
}
function render(){$('bal').textContent=S.coins.toLocaleString('ru-RU');renderTap();renderShop();$('mus').textContent=S.mute?'🔇':'🎵'}
function pop(x,y,t){var e=document.createElement('div');e.className='pop';e.textContent=t;e.style.left=(x-14)+'px';e.style.top=(y-30)+'px';document.body.appendChild(e);setTimeout(function(){e.remove()},850)}
/* Падающие бонусы: добавь сюда ещё (например ночную фурию) */
var BONUS=[{img:IMG.f,pts:100}];
var fallOn=false;
function spawnFall(){
  if(fallOn)return;fallOn=true;var b=BONUS[Math.floor(Math.random()*BONUS.length)];
  var f=document.createElement('div');f.className='fall';f.innerHTML='<img src="'+b.img+'" alt="Бонус">';
  f.style.left=(Math.random()*(innerWidth-100)+5)+'px';document.body.appendChild(f);
  requestAnimationFrame(function(){requestAnimationFrame(function(){f.style.top=(innerHeight+20)+'px'})});
  var done=function(){f.remove();fallOn=false};
  f.addEventListener('pointerdown',function(e){e.stopPropagation();S.coins+=b.pts;pop(e.clientX,e.clientY,'+'+b.pts);save();render();done()});
  setTimeout(done,5300);
}
var tap=$('tap');
tap.addEventListener('pointerdown',function(e){S.coins+=1;tap.classList.add('p');pop(e.clientX,e.clientY,'+1');save();$('bal').textContent=S.coins.toLocaleString('ru-RU');if(Math.random()<0.012)spawnFall()});
['pointerup','pointerleave','pointercancel'].forEach(function(n){tap.addEventListener(n,function(){tap.classList.remove('p')})});
function openOv(id){$(id).classList.add('on')}
function closeOv(id){$(id).classList.remove('on')}
$('openShop').onclick=function(){$('msg').textContent='';renderShop();openOv('shop')};
$('openSkins').onclick=function(){renderSkins();openOv('skins')};
$('closeShop').onclick=function(){closeOv('shop')};$('closeSkins').onclick=function(){closeOv('skins')};
['shop','skins'].forEach(function(id){$(id).addEventListener('pointerdown',function(e){if(e.target===this)closeOv(id)})});
$('items').addEventListener('click',function(e){
  var id=e.target.getAttribute&&e.target.getAttribute('data-id');if(!id||S.own[id])return;
  if(S.coins<CH[id].price){$('msg').textContent='Недостаточно монет';return}
  S.coins-=CH[id].price;S.own[id]=true;save();render();$('msg').textContent='Куплено! Выбрать можно в «Скины»';
});
$('skins').addEventListener('click',function(e){
  var t=e.target.closest('[data-skin],[data-col]');if(!t)return;
  if(t.hasAttribute('data-skin'))S.skin=t.getAttribute('data-skin');else S.color=+t.getAttribute('data-col');
  save();renderTap();renderSkins();
});
/* Музыка (синтезируется в браузере, запускается после первого касания) */
var AC,timer,step=0,nextT=0;
var MEL=[0,4,7,12,9,7,4,2, 0,4,7,9,12,9,7,4, 5,9,12,9,7,4,2,4, 7,4,2,0,2,4,7,4];
var BASS=[-12,-17,-15,-20];
function fr(n){return 261.63*Math.pow(2,n/12)}
function note(n,t,dur,type,vol){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fr(n);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function sched(){while(nextT<AC.currentTime+.4){var i=step%32;note(MEL[i],nextT,.2,'triangle',.07);if(i%8===0)note(BASS[(i/8)|0],nextT,1.6,'sine',.09);if(i%4===2)note(MEL[i]-12,nextT,.1,'square',.012);nextT+=.2;step++}}
function startMusic(){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();if(!timer){nextT=AC.currentTime+.05;timer=setInterval(sched,100)}}catch(e){}}
function stopMusic(){if(timer){clearInterval(timer);timer=null}if(AC)AC.suspend()}
document.addEventListener('pointerdown',startMusic,{once:true});
$('mus').onclick=function(e){e.stopPropagation();S.mute=!S.mute;save();$('mus').textContent=S.mute?'🔇':'🎵';S.mute?stopMusic():startMusic()};
document.addEventListener('visibilitychange',function(){if(document.hidden)stopMusic();else startMusic()});
$('openMap').onclick=function(){$('mapmsg').textContent='';renderMap();openOv('map')};
$('closeMap').onclick=function(){closeOv('map')};
$('map').addEventListener('pointerdown',function(e){if(e.target===this)closeOv('map')});
$('locs').addEventListener('click',function(e){
  var id=e.target.getAttribute&&e.target.getAttribute('data-loc');if(!id)return;
  var l=LOCS.filter(function(x){return x.id===id})[0];if(!l)return;
  if(l.price>0&&!S.locOwn[id]){
    if(S.coins<l.price){$('mapmsg').textContent='Недостаточно монет';return}
    S.coins-=l.price;S.locOwn[id]=true;$('mapmsg').textContent='Локация куплена!';
  }
  S.loc=id;save();applyLoc();render();renderMap();
});
applyLoc();render();
